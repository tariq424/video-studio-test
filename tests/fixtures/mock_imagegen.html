<!doctype html><html><body>
<!-- A stand-in for Gemini: upload menu -> hidden file input, rich-textarea, streamed model-response, generated image. -->
<div id="chat"></div>
<button aria-label="Open upload file menu" id="menu">+</button>
<div id="menuitems" style="display:none"><button role="menuitem" id="upfiles">Upload files</button></div>
<rich-textarea><div class="ql-editor" contenteditable="true"></div></rich-textarea>
<button aria-label="Send message" id="send">Send</button>
<script>
let uploaded = false; let made = 0;
document.getElementById('menu').onclick = () => { document.getElementById('menuitems').style.display = 'block'; };
document.getElementById('upfiles').onclick = () => {
  const f = document.createElement('input'); f.type = 'file'; f.onchange = () => { uploaded = true; }; f.click();
};
function respond(text, img) {
  const r = document.createElement('model-response'); document.getElementById('chat').appendChild(r);
  const stop = document.createElement('button'); stop.setAttribute('aria-label', 'Stop response'); document.body.appendChild(stop);
  const words = text.split(' '); let i = 0;
  const iv = setInterval(() => {
    r.textContent += (i ? ' ' : '') + words[i++];
    if (i >= words.length) {
      clearInterval(iv);
      if (img) { const c = document.createElement('canvas'); c.width = 768; c.height = 1024; const g = c.getContext('2d');
        g.fillStyle = ['#2a5', '#25a', '#a52'][made++ % 3]; g.fillRect(0, 0, 768, 1024); g.fillStyle = '#fd3'; g.beginPath(); g.arc(384, 560, 220, 0, 7); g.fill();
        const im = new Image(); im.style.width = '320px'; im.src = c.toDataURL('image/png'); r.appendChild(im); }
      stop.remove();
    }
  }, 40);
}
document.getElementById('send').onclick = () => {
  const ed = document.querySelector('.ql-editor'); const t = ed.textContent; ed.textContent = '';
  const q = document.createElement('user-query'); q.textContent = t; document.getElementById('chat').appendChild(q);
  if (/^Describe this image/.test(t)) {
    if (!uploaded) { respond('Please upload an image first.'); return; }
    respond('The image shows a golden retriever sitting on a sunny lawn in a park, trees behind it, soft warm light. PROMPT: A photorealistic golden retriever sitting upright on a sunlit park lawn, trees softly blurred behind, warm afternoon light, eye-level shot, shallow depth of field');
  } else if (/^Generate an image: .*REFUSE/.test(t)) { respond("I can't create images like that one. Try something else.");
  } else if (/^Generate (an image:|a second image|another image)/.test(t)) { respond('Here is your image', true);
  } else if (/^Write a prompt/.test(t)) { respond('PROMPT: A wide cinematic shot of a quiet laptop on a wooden desk at dawn, soft window light, shallow depth of field, photorealistic'); }
};
</script></body></html>
